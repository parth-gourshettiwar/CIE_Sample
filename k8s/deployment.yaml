apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task-api
  labels:
    app: devops-task-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-task-api
  template:
    metadata:
      labels:
        app: devops-task-api
    spec:
      containers:
      - name: api
        image: devops-task-api:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 2
          periodSeconds: 5
